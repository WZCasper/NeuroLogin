<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>NeuroLogin — Панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          bg: '#0c0c0c',
          panel: '#151515',
          panel2: '#1c1c1c',
          border: '#2c2c2c',
          yellow: '#c9a92c',
          yellowDim: '#8a7620',
          text: '#e8e6df',
          textDim: '#9b988e'
        },
        borderRadius: {
          none: '0px', DEFAULT: '0px', sm: '0px', md: '0px', lg: '0px', xl: '0px', full: '0px'
        }
      }
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-bg text-text font-sans min-h-screen text-sm sm:text-base">

<div x-data="adminApp()" x-init="init()" class="min-h-screen flex flex-col">

  <!-- ======================= NOT OPENED VIA TELEGRAM ======================= -->
  <template x-if="!isInTelegram">
    <div class="flex-1 flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-sm border border-border bg-panel p-5 sm:p-6 text-center">
        <div class="w-8 h-8 border border-yellow flex items-center justify-center text-yellow font-bold mx-auto mb-4">N</div>
        <p class="text-sm text-textDim mb-4">
          Эта панель открывается изнутри Telegram — так бот сразу знает, кто вы,
          и может сохранять изменения без паролей и токенов.
        </p>
        <a :href="'https://t.me/' + cfg.botUsername" class="inline-block w-full border border-yellow text-yellow px-4 py-2.5 text-sm font-medium">
          <i class="fa-brands fa-telegram mr-2"></i>Открыть бота в Telegram
        </a>
        <p class="text-xs text-textDim mt-3">
          В чате с ботом нажмите кнопку «🎛 Открыть панель» под полем ввода
          (или отправьте команду /panel).
        </p>
      </div>
    </div>
  </template>

  <!-- ======================= MAIN APP ======================= -->
  <template x-if="isInTelegram">
    <div class="flex-1 flex flex-col">

      <!-- Header -->
      <header class="border-b border-border bg-panel px-4 sm:px-6 py-3 flex items-center gap-2">
        <div class="w-8 h-8 border border-yellow flex items-center justify-center text-yellow font-bold shrink-0">N</div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-semibold leading-tight truncate">NeuroLogin</h1>
          <p class="text-xs text-textDim truncate">
            <span x-text="telegramUser.firstName"></span><span x-show="telegramUser.username"> · @<span x-text="telegramUser.username"></span></span>
          </p>
        </div>
      </header>

      <!-- Group selector -->
      <div class="border-b border-border bg-panel px-4 sm:px-6 py-3 flex flex-col gap-2 sm:flex-row sm:items-center">
        <div class="flex items-center gap-2 text-sm text-textDim shrink-0">
          <i class="fa-solid fa-layer-group text-yellow"></i><span>Группа:</span>
        </div>
        <select
          x-show="groups.length > 0"
          x-model="selectedGroupId"
          @change="selectGroup($event.target.value)"
          class="bg-panel2 border border-border px-3 py-2 text-sm text-text w-full sm:w-auto sm:min-w-[220px]"
        >
          <template x-for="g in groups" :key="g.chatId">
            <option :value="g.chatId" x-text="g.title"></option>
          </template>
        </select>
        <span x-show="groups.length===0 && !loading" class="text-sm text-textDim">
          Вы ещё не добавляли бота ни в одну группу.
        </span>
      </div>

      <!-- Tabs -->
      <nav class="border-b border-border bg-panel px-4 sm:px-6 flex gap-1 overflow-x-auto" x-show="groups.length > 0">
        <button @click="tab='users'" :class="tab==='users' ? 'border-b-2 border-yellow text-yellow' : 'text-textDim'" class="px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium whitespace-nowrap">
          <i class="fa-solid fa-users mr-1.5 sm:mr-2"></i>Участники
        </button>
        <button @click="tab='survey'" :class="tab==='survey' ? 'border-b-2 border-yellow text-yellow' : 'text-textDim'" class="px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium whitespace-nowrap">
          <i class="fa-solid fa-list-check mr-1.5 sm:mr-2"></i>Опрос и ветвления
        </button>
        <button @click="tab='triggers'" :class="tab==='triggers' ? 'border-b-2 border-yellow text-yellow' : 'text-textDim'" class="px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium whitespace-nowrap">
          <i class="fa-solid fa-bolt mr-1.5 sm:mr-2"></i>Триггеры
        </button>
      </nav>

      <main class="flex-1 px-4 sm:px-6 py-5 sm:py-6 max-w-6xl w-full mx-auto">

        <div x-show="groups.length === 0 && !loading" class="border border-border bg-panel p-5 text-sm text-textDim">
          <p class="mb-2">Групп пока нет. Чтобы начать:</p>
          <ol class="list-decimal list-inside flex flex-col gap-1">
            <li>Добавьте бота <span class="text-text">@<span x-text="cfg.botUsername"></span></span> в свою группу (сделайте это сами, как администратор).</li>
            <li>Закройте и снова откройте эту панель кнопкой в чате с ботом.</li>
          </ol>
        </div>

        <div x-show="pendingSaveNotice" class="border border-yellow text-yellow bg-panel p-3 text-xs mb-4">
          Сохранение закроет эту панель — так работает Telegram. Бот пришлёт кнопку, чтобы открыть её снова.
        </div>

        <!-- USERS TAB -->
        <div x-show="tab==='users' && groups.length > 0">
          <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
            <h2 class="text-sm sm:text-base font-semibold">Участники (<span x-text="users.length"></span>)</h2>
            <div class="flex gap-2">
              <button @click="loadGroupData" class="text-xs sm:text-sm border border-border px-3 py-1.5 hover:border-yellow transition-colors whitespace-nowrap">
                <i class="fa-solid fa-rotate mr-1.5"></i>Обновить
              </button>
              <button x-show="usersDirty" @click="saveUsers" class="text-xs sm:text-sm border border-yellow text-yellow px-3 py-1.5 whitespace-nowrap">
                <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>Сохранить правки
              </button>
            </div>
          </div>

          <div x-show="loading" class="text-textDim text-sm">Загрузка данных...</div>
          <div x-show="!loading && users.length===0" class="text-textDim text-sm">Пока нет подтверждённых анкет.</div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="u in users" :key="u.userId">
              <div class="border border-border bg-panel p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    <div class="w-9 h-9 border border-yellow flex items-center justify-center text-yellow text-sm font-semibold shrink-0" x-text="initials(u)"></div>
                    <div class="min-w-0">
                      <div class="font-medium truncate" x-text="fieldValue(u, 'Имя') || ('ID ' + u.userId)"></div>
                      <div class="text-xs text-textDim truncate" x-text="u.username ? '@' + u.username : 'ID ' + u.userId"></div>
                    </div>
                  </div>
                  <button @click="copyUser(u)" class="text-xs border border-border px-2 py-1 hover:border-yellow transition-colors shrink-0" title="Скопировать все данные">
                    <i class="fa-regular fa-copy mr-1"></i>Копировать
                  </button>
                </div>

                <div class="border-t border-border pt-3 flex flex-col gap-1.5 text-sm">
                  <template x-for="(a, key) in u.answers" :key="key">
                    <div class="flex justify-between gap-3">
                      <span class="text-textDim shrink-0" x-text="a.field + ':'"></span>
                      <span class="text-right break-words" x-show="!editing[u.userId] || editing[u.userId] !== key" x-text="a.value"></span>
                      <input
                        x-show="editing[u.userId] === key"
                        x-model="editBuffer"
                        class="bg-panel2 border border-yellowDim px-2 py-0.5 text-right text-text w-1/2"
                        @keydown.enter="commitFieldEdit(u, key)"
                      />
                    </div>
                  </template>
                </div>

                <template x-for="(a, key) in u.answers" :key="'media-'+key">
                  <img x-show="a.mediaPath" :src="rawUrl(a.mediaPath)" class="w-full border border-border" />
                </template>

                <div class="border-t border-border pt-3 flex gap-2 flex-wrap">
                  <template x-for="(a, key) in u.answers" :key="'btn-'+key">
                    <button @click="startEdit(u, key, a.value)" class="text-xs border border-border px-2 py-1 hover:border-yellow transition-colors">
                      <i class="fa-solid fa-pen mr-1"></i><span x-text="'Изм. ' + a.field"></span>
                    </button>
                  </template>
                  <button x-show="editing[u.userId]" @click="commitFieldEdit(u, editing[u.userId])" class="text-xs border border-yellow text-yellow px-2 py-1">
                    <i class="fa-solid fa-check mr-1"></i>Готово
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- SURVEY TAB -->
        <div x-show="tab==='survey' && groups.length > 0">
          <div class="flex items-center justify-between mb-4 gap-2 flex-wrap">
            <h2 class="text-sm sm:text-base font-semibold">Шаги опроса</h2>
            <div class="flex gap-2">
              <button @click="addStep" class="text-xs sm:text-sm border border-border px-3 py-1.5 hover:border-yellow transition-colors whitespace-nowrap">
                <i class="fa-solid fa-plus mr-1.5"></i>Добавить шаг
              </button>
              <button @click="saveSurvey" class="text-xs sm:text-sm border border-yellow text-yellow px-3 py-1.5 whitespace-nowrap">
                <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>Сохранить
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-3">
            <template x-for="(step, idx) in survey" :key="step.id">
              <div class="border border-border bg-panel p-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <label class="flex flex-col gap-1 text-xs text-textDim">ID шага
                    <input x-model="step.id" class="bg-panel2 border border-border px-2 py-1.5 text-text" />
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim">Поле (название данных)
                    <input x-model="step.field" class="bg-panel2 border border-border px-2 py-1.5 text-text" />
                    <span class="text-yellow" x-show="step.field">Переменная для триггеров: <span x-text="'{' + step.field + '}'"></span></span>
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim md:col-span-2">Текст вопроса
                    <input x-model="step.question" class="bg-panel2 border border-border px-2 py-1.5 text-text" />
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim">Тип ответа
                    <select x-model="step.type" class="bg-panel2 border border-border px-2 py-1.5 text-text">
                      <option value="text">Текст</option>
                      <option value="photo">Фото</option>
                      <option value="file">Файл</option>
                    </select>
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim">Следующий шаг (по умолчанию)
                    <input x-model="step.next" class="bg-panel2 border border-border px-2 py-1.5 text-text" placeholder="id следующего шага" />
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim md:col-span-2">
                    Ветвления (ответ → id шага): ответ1=шаг1, ответ2=шаг2
                    <input :value="branchesToText(step.branches)" @change="step.branches = textToBranches($event.target.value)" class="bg-panel2 border border-border px-2 py-1.5 text-text" placeholder="pc=pc_specs, консоль=console_type" />
                  </label>
                </div>
                <div class="flex justify-end mt-3">
                  <button @click="removeStep(idx)" class="text-xs border border-border px-2 py-1 hover:border-yellow transition-colors">
                    <i class="fa-solid fa-trash mr-1"></i>Удалить шаг
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- TRIGGERS TAB -->
        <div x-show="tab==='triggers' && groups.length > 0">
          <div class="flex items-center justify-between mb-2 gap-2 flex-wrap">
            <h2 class="text-sm sm:text-base font-semibold">Триггеры по ключевым словам</h2>
            <div class="flex gap-2">
              <button @click="addTrigger" class="text-xs sm:text-sm border border-border px-3 py-1.5 hover:border-yellow transition-colors whitespace-nowrap">
                <i class="fa-solid fa-plus mr-1.5"></i>Добавить триггер
              </button>
              <button @click="saveTriggers" class="text-xs sm:text-sm border border-yellow text-yellow px-3 py-1.5 whitespace-nowrap">
                <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>Сохранить
              </button>
            </div>
          </div>

          <p class="text-xs text-textDim mb-4">
            Бот проверяет каждое сообщение в группе на совпадение с ключевым словом и отвечает заданным текстом.
            <span x-show="surveyFieldNames.length">
              Доступные переменные: <span class="text-text" x-text="surveyFieldNames.map(f => '{' + f + '}').join(', ')"></span>
            </span>
          </p>

          <div x-show="triggers.length === 0" class="text-textDim text-sm mb-4">Триггеров пока нет.</div>

          <div class="flex flex-col gap-3">
            <template x-for="(trigger, idx) in triggers" :key="trigger.id">
              <div class="border border-border bg-panel p-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <label class="flex flex-col gap-1 text-xs text-textDim">Ключевое слово / фраза
                    <input x-model="trigger.keyword" class="bg-panel2 border border-border px-2 py-1.5 text-text" placeholder="например: правила" />
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim">Тип совпадения
                    <select x-model="trigger.matchType" class="bg-panel2 border border-border px-2 py-1.5 text-text">
                      <option value="contains">Содержит слово где угодно в сообщении</option>
                      <option value="exact">Сообщение целиком равно фразе</option>
                    </select>
                  </label>
                  <label class="flex items-center gap-2 text-xs text-textDim md:col-span-2">
                    <input type="checkbox" x-model="trigger.caseSensitive" class="accent-yellow" />
                    Учитывать регистр букв
                  </label>
                  <label class="flex flex-col gap-1 text-xs text-textDim md:col-span-2">Ответ бота
                    <textarea x-model="trigger.response" rows="3" class="bg-panel2 border border-border px-2 py-1.5 text-text" placeholder="Привет, {Имя}! Вот правила группы..."></textarea>
                  </label>
                </div>
                <div class="flex justify-end mt-3">
                  <button @click="removeTrigger(idx)" class="text-xs border border-border px-2 py-1 hover:border-yellow transition-colors">
                    <i class="fa-solid fa-trash mr-1"></i>Удалить триггер
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

      </main>
    </div>
  </template>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-text="toast" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-auto bg-panel border border-yellow px-4 py-2 text-sm text-center sm:text-left"></div>

</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
